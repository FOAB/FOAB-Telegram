services:
  foab:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FOAB_TELEGRAM_BOT_TOKEN: ${FOAB_TELEGRAM_BOT_TOKEN:?FOAB_TELEGRAM_BOT_TOKEN is required}
      FOAB_DATABASE_URL: ${FOAB_DATABASE_URL:?FOAB_DATABASE_URL is required}
      FOAB_MIGRATION_DATABASE_URL: ${FOAB_MIGRATION_DATABASE_URL:-}
      FOAB_WEB_APP_URL: ${FOAB_WEB_APP_URL:?FOAB_WEB_APP_URL is required}
      FOAB_WEB_APP_HOST: 0.0.0.0
      FOAB_WEB_APP_PORT: 3000
    expose:
      - "3000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
